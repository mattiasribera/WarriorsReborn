; WarriorsReborn mod (docs/MODDING.md, "No combo slow motion"). Our own code: it asks the runtime
; (ModComboSlowMo) to skip the slow motion the game plays during some fight combos in single
; player, as the game itself does in co-op; no game files are included.
id = no-combo-slowmo
name = No combo slow motion
name.es = Sin cámara lenta en combos
description = In single player the game slows the whole fight down for a moment during some combos (such as X+A, A, A), most of all with Rage on. In co-op it never does. This mod plays those combos at full speed in single player too, as in co-op. Slow motion in scripted scenes stays.
description.es = En un jugador el juego pone la pelea en cámara lenta un momento durante algunos combos (como X+A, A, A), sobre todo con la furia activada. En cooperativo nunca lo hace. Este mod juega esos combos a velocidad normal también en un jugador. La cámara lenta de las escenas del guion se mantiene.
version = 1.0
author = WarriorsReborn
saves = no
min_runtime = 1.10
boot = noslowmo.lua
