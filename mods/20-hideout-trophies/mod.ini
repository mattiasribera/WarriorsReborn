; WarriorsReborn example mod (docs/MODDING.md). Our own code: it places objects that are on the
; retail disc by their model names; Cleon's necklace is built on your PC from your own game files
; by tools/mod_meshes (python3 -m mod_meshes cleon-necklace); no game files are included.
id = hideout-trophies
name = Hideout trophies
name.es = Trofeos en la guarida
description = Trophies unlocked like the game's own. On the trophy wall: the Savage Huns' dragon, Ash's vest and Cleon's framed necklace (its mesh is built from your game files). In the caged room under the main floor, now lit and open through its north door: one trophy per gang you beat. Nothing is saved.
description.es = Trofeos que se desbloquean como los del juego. En la pared: el dragón de los Savage Huns, el chaleco de Ash y el collar de Cleon (malla creada desde tus archivos). En el cuarto enrejado bajo el piso principal, iluminado y con su puerta norte abierta: un trofeo por pandilla vencida. No guarda nada.
version = 1.6
author = WarriorsReborn
saves = no
meshes = meshes-v1
boot = config.lua
after.level95 = trophies.lua
collision = cage.col
