; Cleon's necklace in a shadow-box frame for the trophy wall (trophies.lua places it).
; Built by the game from your own disc at the mod's first load (docs/MODDING.md "assets.ini").
format = 1

[source cleon]
char = warr_cl

[texture board]               ; the necklace painted on Cleon's chest, laid on red velvet, enlarged
base    = cleon.skin0
require = size 512 512
crop    = 430 300 88 132      ; the necklace with a margin of chest
mask    = colour(r-b <= 10, sum >= 135), parts >= 12, inside, at_least 400   ; the silver
polish  = keep 0.6, grey 0.4, gain 1.55, add 12                            ; polished silver
fill    = velvet 124 26 40, noise 0.08, seed 7, shadow                     ; velvet, a soft shadow under the chain
scale   = 3 bilinear

[texture trophy]              ; the frame's texture: the board and a strip of drawn wood
canvas  = 512 512, colour 124 26 40
place   = board, at 0 0
place   = wood 132 88 52 seed 11, at 0 448 512 64, as wood

[mesh frame]                  ; a closed box frame: the velvet board and four wooden bars
shape   = shadow_box, board 88 132 texels 0.0029, bar 0.03, depth 0.04, board_depth 0.012
uv      = board trophy.board, wood trophy.wood
host    = dyn_s_paper_list    ; a sheet of paper nothing in the game places
colour  = ff000000
texture = trophy
