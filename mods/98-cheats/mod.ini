; WarriorsReborn mod (docs/MODDING.md, "Cheats menu"). Our own code: it calls the game's own
; cheat functions (DbgEnterCheat / DoCheat, the ones the button codes call) by name; no game files
; are included.
id = cheats
name = Cheats menu
name.es = Menú de trucos
description = Use the game's own cheats from a menu instead of button codes: hold Back + LB (or press F8) in a mission or in free roam. Unlimited health, rage and sprint switch on and off; the rest work once, like the codes. Rage ends unlimited health, as in the game. Cheats that change your save for good say so and ask twice.
description.es = Usa los trucos del juego desde un menú en vez de códigos: mantén Back + LB (o pulsa F8) en una misión o en el modo libre. Salud, furia y sprint ilimitados se activan y desactivan; el resto, una vez. La furia quita la salud ilimitada, como en el juego. Los que cambian tu partida avisan y piden confirmar.
version = 1.1
author = WarriorsReborn
saves = yes
min_runtime = 1.11
after.global = cheats.lua
after.level95 = rearm.lua
