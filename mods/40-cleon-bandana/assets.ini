; Cleon's bandana as a hat the game can knock off (bandana.lua turns the group "knocked" on).
; Built by the game from your own disc at the mod's first load (docs/MODDING.md "assets.ini").
format = 1

[source cleon]
char = warr_cl                ; Cleon
[source flash]
char = dest_cl                ; his flashback model: the same head base, no bandana

[texture knocked-skin]        ; Cleon's skin with the flashback head's texels (face, short hair, ear, neck)
base    = cleon.skin0
require = same_size flash.skin0
paste   = flash.skin0, uv_of flash.islands(above 1.6), dilate 2, keep cleon.islands(below 1.6)

[mesh knocked-body]           ; Cleon with the flashback head once the bandana is off
from      = cleon
head_swap = flash, above 1.6, closed_seam required
target    = cleon skin 0      ; only Cleon's own skin, not the ghost skins
texture   = knocked-skin
group     = knocked

[mesh bandana]                ; the bandana, cut out in the head joint's frame, drawn as an unused hat
from    = cleon
take    = headgear(flash, above 1.6, tolerance 0.005)
rigid   = joint bip_sw_head
host    = dyn_dest_ltb        ; a Destroyers hat no character wears
colour  = ff000000
texture = cleon.skin0
group   = knocked

[hide bandana-worn]           ; worn: the hat object is not drawn (Cleon's head has the bandana)
host = dyn_dest_ltb
