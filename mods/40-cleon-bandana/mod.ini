; WarriorsReborn example mod (docs/MODDING.md). Our own code: its meshes are built on your PC from
; your own game files by tools/mod_meshes (python3 -m mod_meshes cleon-bandana); none are included.
id = cleon-bandana
name = Cleon loses his bandana
name.es = Cleon pierde su bandana
description = Cleon's bandana is a hat the game can knock off: a hard hit throws it to the ground, and without it Cleon shows his head as in the flashback mission (short hair, no bandana) until the level reloads. Needs its meshes built once from your game files (see docs/MODDING.md); without them the mod changes nothing.
description.es = La bandana de Cleon es un sombrero que el juego puede tirar: un golpe fuerte la lanza al suelo y sin ella Cleon muestra la cabeza de la misión del recuerdo (pelo corto) hasta que se recarga el nivel. Necesita sus mallas creadas desde tus archivos del juego (ver docs/MODDING.md); sin ellas no cambia nada.
version = 1.2
author = WarriorsReborn
saves = no
meshes = meshes-v2
boot = bandana.lua
