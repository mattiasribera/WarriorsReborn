id = cleon-bandana
name = Cleon loses his bandana
name.es = Cleon pierde su bandana
description = Cleon's bandana is a hat the game can knock off: a hard hit throws it to the ground, and without it Cleon shows his head as in the flashback mission (short hair, no bandana) until the level reloads. The game builds its meshes from your game files the first time the mod loads; if it cannot, nothing changes.
description.es = La bandana de Cleon es un sombrero que el juego puede tirar: un golpe fuerte la lanza al suelo y sin ella Cleon muestra la cabeza de la misión del recuerdo (pelo corto) hasta que se recarga el nivel. El juego crea sus mallas desde tus archivos la primera vez que carga el mod; si no puede, no cambia nada.
version = 1.4
author = WarriorsReborn
saves = no
boot = bandana.lua
