; The glasses of Vargas and Masai as hats the game can knock off, and broken glasses on the ground
; (dirty.lua spawns them). Built by the game from your own disc at the mod's first load
; (docs/MODDING.md "assets.ini").
format = 1

[source vargas]
char = hurr_va                ; Vargas, the Hurricanes' leader (CfgChar 119)
[source masai]
char = 0x2c7976bd             ; Masai, the Riffs (CfgChar 64 names a skin record of this model)
[source sun]
prop = 0x226dffca             ; the sunglasses prop (dyn_sun)
[source trcw]
prop = 0x7a24d0ef             ; the gold-rimmed glasses prop (dyn_tr_cw)
[source turnso]
prop = 0xfcc56d51             ; the Turnbull ACs' sunglasses prop (dyn_turn_so)
[source plma1]
prop = 0x3d6fceb9             ; Cameron's sunglasses prop (dyn_pl_ma1)

; ---- Vargas: his glasses as a spare hat, his face without them, per character (instance group) ----
[mesh vargas-glasses]
from    = vargas
take    = largest_apart(min_tris 10, min_width 0.1, top 0.4)   ; the glasses: a piece apart from the face
rigid   = joint bip_sw_head
host    = dyn_civl_hl_ho      ; a hat no character wears
colour  = ff000000
texture = vargas.skin0
group   = glasses-vargas
worn    = yes                 ; drawn per character: the group's instance marker

[mesh vargas-face]
from    = vargas
drop    = largest_apart(min_tris 10, min_width 0.1, top 0.4)
target  = vargas              ; every skin of his model
group   = glasses-vargas

[hide vargas-worn]            ; the hat on a head is not drawn (the face has its own glasses)
host = dyn_civl_hl_ho

; ---- Masai ----
[mesh masai-glasses]
from    = masai
take    = largest_apart(min_tris 10, min_width 0.1, top 0.4)
rigid   = joint bip_sw_head
host    = dyn_pl_dr
colour  = ff000000
texture = masai.skin0
group   = glasses-masai
worn    = yes

[mesh masai-face]
from    = masai
drop    = largest_apart(min_tris 10, min_width 0.1, top 0.4)
target  = masai
group   = glasses-masai

[hide masai-worn]
host = dyn_pl_dr

; ---- broken glasses: drawn on a newspaper nothing in the game places, where dirty.lua puts points ----
[mesh broken-vargas]
from    = vargas
take    = largest_apart(min_tris 10, min_width 0.1, top 0.4)
rigid   = joint bip_sw_head
break   = turn 28, gap 0.035, lens 35, shards 9, seed 1   ; snapped at the bridge, one lens in shards
host    = dyn_s_newspaper_c
colour  = ff000000
texture = vargas.skin0
crack   = lines 7, seed 1     ; the kept lens cracked
group   = broken-vargas
placed  = yes

[mesh broken-masai]
from    = masai
take    = largest_apart(min_tris 10, min_width 0.1, top 0.4)
rigid   = joint bip_sw_head
break   = turn 28, gap 0.035, lens 35, shards 9, seed 2
host    = dyn_s_newspaper_c
colour  = ff000000
texture = masai.skin0
crack   = lines 7, seed 2
group   = broken-masai
placed  = yes

[mesh broken-sun]
from    = sun
take    = all
paint   = frame 24 24 26, lens 30 34 40, size 64           ; its own flat colours
break   = turn 28, gap 0.035, lens 35, shards 9, seed 3
host    = dyn_s_newspaper_c
colour  = ff000000
crack   = lines 7, seed 3
group   = broken-sun
placed  = yes

[mesh broken-trcw]
from    = trcw
take    = all
paint   = frame 196 160 72, lens 150 165 170, size 64
break   = turn 28, gap 0.035, lens 35, shards 9, seed 4
host    = dyn_s_newspaper_c
colour  = ff000000
crack   = lines 7, seed 4
group   = broken-trcw
placed  = yes

[mesh broken-turnso]
from    = turnso
take    = all
paint   = frame 22 22 24, lens 28 30 34, size 64
break   = turn 28, gap 0.035, lens 35, shards 9, seed 5
host    = dyn_s_newspaper_c
colour  = ff000000
crack   = lines 7, seed 5
group   = broken-turnso
placed  = yes

[mesh broken-plma1]
from    = plma1
take    = all
paint   = frame 26 24 24, lens 34 32 30, size 64
break   = turn 28, gap 0.035, lens 35, shards 9, seed 6
host    = dyn_s_newspaper_c
colour  = ff000000
crack   = lines 7, seed 6
group   = broken-plma1
placed  = yes
