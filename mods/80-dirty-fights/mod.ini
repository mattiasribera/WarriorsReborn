; WarriorsReborn example mod (docs/MODDING.md). Our own code: it uses the game's own hat settings by
; model name; the glasses' meshes are built by the game from your own game files at its first load
; (assets.ini, docs/MODDING.md "assets.ini"); none are included.
id = dirty-fights
name = Dirty fights: falling accessories
name.es = Peleas más sucias: accesorios que caen
description = Glasses, caps, winter hats, a do-rag, a rag, a paper bag and the Panzers' and Spider's hats fly off in hard hits and stay on the ground, where anyone can pick them up. Glasses may break. Some fighters walk back for their hat. Vargas and Masai lose their sunglasses too (meshes built from your game files).
description.es = Gafas, gorras, gorros, pañuelos, una bolsa de papel, los gorros de los Panzers y el casco de Spider salen volando con golpes fuertes y quedan en el suelo; se pueden recoger. Las gafas pueden romperse. Algunos vuelven por su gorra. Vargas y Masai también pierden las gafas (mallas creadas desde tu juego).
version = 1.5
author = WarriorsReborn
saves = no
boot = dirty.lua
after.config_preload2 = poses.lua
