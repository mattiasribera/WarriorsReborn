; WarriorsReborn example mod (docs/MODDING.md). Our own code: it uses the game's own hat settings by
; model name; the glasses' meshes are built on your PC from your own game files by tools/mod_meshes
; (python3 -m mod_meshes dirty-fights); none are included.
id = dirty-fights
name = Dirty fights: falling accessories
name.es = Peleas más sucias: accesorios que caen
description = Glasses, caps, winter hats and a do-rag fly off in hard hits and stay on the ground, where anyone can pick them up. Glasses may break into shards. Some fighters walk back for their hat once the fight calms down. With its meshes built (docs/MODDING.md) Vargas and Masai lose their sunglasses too.
description.es = Gafas, gorras, gorros de lana y un pañuelo salen volando con golpes fuertes y quedan en el suelo; se pueden recoger. Las gafas pueden romperse en pedazos. Algunos vuelven a buscar su gorra cuando la pelea se calma. Con sus mallas creadas (docs/MODDING.md) Vargas y Masai también pierden las gafas.
version = 1.2
author = WarriorsReborn
saves = no
meshes = meshes-v2
boot = dirty.lua
