; WarriorsReborn mod (docs/MODDING.md, "Visible wounds"). Our own code: it stops the player's sprint
; (ModSprint) and caps the crew's speed (ModSpeed) through the runtime; no game files are included.
id = wounds
name = Visible wounds
name.es = Heridas que se notan
description = Low on health you feel it: under 40% health you cannot sprint (you still run at full pace) and your crew limps at 90% and 85% of their speed under 40% and 20%. Healing gives it back. Enemies are never slowed, so fights never get easier. Chases keep full speed.
description.es = Con poca vida se nota: bajo el 40% de vida no puedes esprintar (sigues corriendo a tu ritmo) y tu banda cojea, al 90% y 85% de su velocidad bajo el 40% y el 20%. Curarse lo devuelve. Los enemigos no se frenan: las peleas no son más fáciles. Las persecuciones van a tope.
version = 1.2
author = WarriorsReborn
saves = no
min_runtime = 1.5
boot = wounds.lua
