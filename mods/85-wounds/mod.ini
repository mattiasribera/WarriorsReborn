; WarriorsReborn mod (docs/MODDING.md, "Visible wounds"). Our own code: it caps the game's own
; per-character speed multiplier through the runtime's ModSpeed; no game files are included.
id = wounds
name = Visible wounds
name.es = Heridas que se notan
description = Low on health, you and your crew move slower: under 40% and 20% health you walk, run and sprint at 80% and 65% of your speed (your crew drops to a slower gait). Healing gives the speed back. Enemies keep their speed, so fights never get easier. Chases keep full speed.
description.es = Con poca vida, tú y tu banda os movéis más lento: bajo el 40% y el 20% de vida caminas, corres y esprintas al 80% y 65% (tu banda pasa a un paso más lento). Curarse devuelve la velocidad. Los enemigos no se frenan, así las peleas nunca son más fáciles. Las persecuciones van a toda velocidad.
version = 1.0
author = WarriorsReborn
saves = no
min_runtime = 1.3
boot = wounds.lua
