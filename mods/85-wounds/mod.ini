; WarriorsReborn mod (docs/MODDING.md, "Visible wounds"). Our own code: it caps the game's own
; per-character speed multiplier through the runtime's ModSpeed; no game files are included.
id = wounds
name = Visible wounds
name.es = Heridas que se notan
description = Low on health, you and your crew limp: under 40% and 20% health you move at 90% and 85% of your speed, easing in and out over a few seconds. Healing gives the speed back. Enemies keep their speed, so fights never get easier. Chases keep full speed.
description.es = Con poca vida, tú y tu banda cojeáis: bajo el 40% y el 20% de vida vas al 90% y 85% de tu velocidad, que baja y vuelve en unos segundos. Curarse devuelve la velocidad. Los enemigos no se frenan, así las peleas nunca son más fáciles. Las persecuciones van a toda velocidad.
version = 1.1
author = WarriorsReborn
saves = no
min_runtime = 1.3
boot = wounds.lua
