; WarriorsReborn mod (docs/MODDING.md, "Gang colours on the radar"). Our own code: it gives the
; runtime a colour per character id with ModRadarColor; no game files are included.
id = radar-colors
name = Gang colours on the radar
name.es = Colores de pandilla en el radar
description = Enemy dots on the radar take the colour of their gang (Riffs orange, Destroyers blue, Lizzies pink ...), transit cops are bright green and riot cops dark grey. Other cops, your crew and objectives keep the game's colours.
description.es = Los puntos enemigos del radar toman el color de su pandilla (Riffs naranja, Destroyers azul, Lizzies rosa ...), los policías del metro son verde brillante y los antidisturbios gris oscuro. Los demás policías, tu banda y los objetivos conservan los colores del juego.
version = 1.0
author = WarriorsReborn
saves = no
min_runtime = 1.9
boot = radar_colors.lua
after.config_preload2 = radar_colors.lua
