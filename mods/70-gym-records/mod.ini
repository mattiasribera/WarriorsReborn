; WarriorsReborn example mod (docs/MODDING.md). Our own code: it wraps the hideout gym's own Lua
; functions by name and keeps its records with ModSave; no game files are included.
id = gym-records
name = Gym records
name.es = Récords del gimnasio
description = After the story, the gym keeps records: the fastest time to reach each exercise's target (bag, chin-ups, push-ups, sit-ups) per rank. After a good set you see your time and the record, and "New record!" when you beat it. Records are kept per profile in the mod's own file; the game's save is not changed.
description.es = Al terminar la historia, el gimnasio guarda récords: el menor tiempo para llegar al objetivo de cada ejercicio (saco, dominadas, flexiones, abdominales) por rango. Tras una serie ves tu tiempo y el récord, y "¡Nuevo récord!" si lo superas. Se guardan por perfil en un archivo del mod; tu partida no cambia.
version = 1.0
author = WarriorsReborn
saves = no
after.level95 = records.lua
after.level95_workout = records.lua
