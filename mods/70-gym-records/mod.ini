; WarriorsReborn example mod (docs/MODDING.md). Our own code: it wraps the hideout gym's own Lua
; functions by name and keeps its records with ModSave; no game files are included.
id = gym-records
name = Gym records
name.es = Récords del gimnasio
description = After you have finished the story, the hideout gym keeps records: the fastest time to reach the target of each exercise (heavy bag, chin-ups, push-ups, sit-ups) at each rank. After a successful set the screen shows your time and the record, and "New record!" when you beat it; each station shows the record of the rank you would train next. Records are kept per save profile in the mod's own file; the game's save is not changed.
description.es = Cuando terminas la historia, el gimnasio de la guarida guarda récords: el menor tiempo para llegar al objetivo de cada ejercicio (saco de boxeo, dominadas, flexiones, abdominales) en cada rango. Tras una serie lograda la pantalla muestra tu tiempo y el récord, y "¡Nuevo récord!" cuando lo superas; cada estación muestra el récord del rango que entrenarías a continuación. Los récords se guardan por perfil en el archivo propio del mod; la partida guardada del juego no cambia.
version = 1.0
author = WarriorsReborn
saves = no
after.level95 = records.lua
after.level95_workout = records.lua
