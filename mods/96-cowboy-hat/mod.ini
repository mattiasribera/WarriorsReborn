; WarriorsReborn mod (docs/MODDING.md, "Cowboy keeps his hat"). Our own code: it uses the game's own
; HuSetKeepHat on Cowboy; no game files are included.
id = cowboy-hat
name = Cowboy keeps his hat
name.es = Cowboy no pierde su sombrero
description = In the original game Cowboy's hat flies off when he takes a beating. With this mod it stays on his head in every fight, as the game already does in a few of its own scenes. Other characters' hats fly as before.
description.es = En el juego original el sombrero de Cowboy sale volando cuando recibe una paliza. Con este mod se queda en su cabeza en todas las peleas, como el juego ya hace en algunas de sus propias escenas. Los sombreros de los demás vuelan como antes.
version = 1.0
author = WarriorsReborn
saves = no
boot = cowboyhat.lua
