; WarriorsReborn example mod (docs/MODDING.md). Our own code: it starts the game's own rumble arenas
; with the player's choice and keeps its records with ModSave; no game files are included.
id = sparring
name = Sparring ring
name.es = Ring de entrenamiento
description = After the story, a spot in the hideout's cage room starts a sparring fight: a gang you beat, its size, your crew and the venue. Fastest wins and longest survival are kept per profile.
description.es = Tras la historia, un lugar del cuarto enrejado de la guarida abre una pelea de práctica: pandilla vencida, rivales, tu banda y el lugar. Guarda las victorias más rápidas y la mayor supervivencia.
version = 1.1
author = WarriorsReborn
saves = no
min_runtime = 1.8
boot = sparring.lua
after.level95 = hideout.lua
after.level1* = fight.lua
collision = ring.col
