format = 1
; Dirty clothes (look 1.1: the vests keep their red): three layers per skin texture of every
; Warrior, painted over his clothes from your own game files (docs/MODDING.md "assets.ini", the
; [layer] steps). clothes.lua turns on "dirty-clothes/<code>-<stage>" per Warrior.

[set warriors]                ; code = the CfgChar model keys whose skins get layers
aj = warr_aj, warr_aj_cv      ; {index} counts in this order (alphabetical: the seeds of 1.1)
cb = warr_cb, warr_cb_cv
cl = warr_cl
co = warr_co, warr_co_cv
fo = warr_fo, warr_fo_cv
re = warr_re, warr_re_cv
sn = warr_sn, warr_sn_cv
sw = warr_sw, warr_sw_cv
ve = warr_ve, warr_ve_cv

[layer {code}-{stage}]
for     = warriors
skins   = claimed _gen _chase _ghost _cv1 _cv2   ; a skin belongs to the code whose keys name it
skip    = ghost, painted < 0.85                  ; the blue ghost skins; skins of another UV layout
seed    = 1000 + 37 * {index}
stages  = 1, 2, 3
region  = cloth(mean_z 0.06..1.66, abs_x <= 0.3, legs below 1.2, skin_island 0.3, head above 1.55)
protect = face_colour near 3 share 0.25          ; chest, neckline, painted necklace stay
vest    = red 0.4, patch 1.45, edge 6, patch_keep 0.12
effect  = grime tint 0.48 0.43 0.36, scale 7, legs_bias 0.45 0.9, torso_bias 1.3 0.8, spread 0.35 0.65 1.0, dark 0.25 0.42 0.55, dark_cloth 0.30 0.45 0.55, desat 0 0.10 0.18
effect  = dust colour 128 118 100, scale 11, edge 0.16 0.22 0.28, legs 0.55, below 0.7
effect  = scuff 0.30 0.40 0.50
effect  = stains 0 3 6
effect  = tears 0 2 7
effect  = damp stage 3, above 1.38, amount 0.3
effect  = wear 0 0.03 0.07
grow    = 2
