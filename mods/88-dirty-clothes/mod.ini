; WarriorsReborn example mod (docs/MODDING.md). Our own code: the dirty and torn clothes are painted
; on your PC over your own game's skin textures by tools/mod_meshes (python3 -m mod_meshes
; dirty-clothes); no game files are included.
id = dirty-clothes
name = Dirty clothes
name.es = Ropa que se ensucia
description = The Warriors' vests, shirts and trousers get dirty, stained and torn as the night goes on and with every fight, each Warrior on his own. Change clothes in the hideout to be clean again. Its layers are built once from your game files (see docs/MODDING.md).
description.es = Chalecos, remeras y pantalones de los Warriors se ensucian, se manchan y se rompen con la historia y cada pelea, cada uno por su cuenta. En la guarida podés cambiarte de ropa. Sus capas se crean una vez desde tus archivos (ver docs/MODDING.md).
version = 1.0
author = WarriorsReborn
saves = no
meshes = layers-v1
boot = clothes.lua
after.level* = start.lua
after.level95 = hideout.lua
