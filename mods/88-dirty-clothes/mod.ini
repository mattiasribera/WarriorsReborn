; WarriorsReborn example mod (docs/MODDING.md). Our own code: the dirty and torn clothes are painted
; on your PC over your own game's skin textures by the game itself, from this folder's assets.ini
; (built once into <hdd>/mods-cache/); no game files are included.
id = dirty-clothes
name = Dirty clothes
name.es = Ropa que se ensucia
description = The Warriors' vests, shirts and trousers get dirty, stained and torn as the night goes on and with every fight, each Warrior on his own. Change clothes in the hideout to be clean again. The game paints its layers once from your own game files.
description.es = Chalecos, remeras y pantalones de los Warriors se ensucian, se manchan y se rompen con la historia y cada pelea, cada uno por su cuenta. En la guarida podés cambiarte de ropa. El juego pinta sus capas una vez desde tus propios archivos.
version = 1.3
author = WarriorsReborn
saves = no
boot = clothes.lua
after.level* = start.lua
after.level95 = hideout.lua
