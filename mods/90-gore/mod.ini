; WarriorsReborn mod (docs/MODDING.md, "Brutal fights"). Our own code: it turns up the game's own
; blood (more drops per hit, ground pools that stay, blood on fighters that stays) through the
; runtime's ModBlood settings; no game files are included.
id = gore
name = Brutal fights
name.es = Peleas más brutales
description = Fights get bloodier with the game's own blood: hits throw more of it, pools on the ground stay until you leave the area (the oldest fade when there are many), and blood on a fighter shows sooner and stays until the next level, even after healing. Nothing new is drawn: more of the game's blood, for longer.
description.es = Las peleas se ensucian con la sangre del juego: los golpes salpican más, los charcos quedan hasta que dejas la zona (los más viejos se borran si hay muchos) y la sangre de un luchador aparece antes y dura hasta el siguiente nivel, aunque se cure. Nada nuevo se dibuja: más sangre del juego, por más tiempo.
version = 1.0
author = WarriorsReborn
saves = no
boot = gore.lua
