; WarriorsReborn mod (docs/MODDING.md, "Brutal fights"). Our own code: it turns up the game's own
; blood (more drops per hit, ground pools that stay, blood on fighters that stays) through the
; runtime's ModBlood settings; no game files are included.
id = gore
name = Brutal fights
name.es = Peleas más brutales
description = Fights get dirtier with the game's own blood: hits throw more blood, the pools on the ground stay until you leave the area (the oldest fade once there are many) and the blood on a fighter shows sooner and stays until the next level, even after healing. Nothing new is drawn: it is the game's own blood, more of it and for longer.
description.es = Las peleas se ensucian con la propia sangre del juego: los golpes salpican más, los charcos en el suelo quedan hasta que dejas la zona (los más viejos se borran cuando hay muchos) y la sangre de un luchador aparece antes y no se va hasta el siguiente nivel, aunque se cure. No se dibuja nada nuevo: es la sangre del juego, más y por más tiempo.
version = 1.0
author = WarriorsReborn
saves = no
boot = gore.lua
