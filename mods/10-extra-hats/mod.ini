; WarriorsReborn example mod (docs/MODDING.md). Our own code: it only uses the game's own hat
; settings by model name; no game files are included.
id = extra-hats
name = More hats fly
name.es = Más sombreros que vuelan
description = Police officers (street, rookie and transit cops) lose their cap in a fight like gang members lose their hats: on hard hits, knockouts and deaths. The cap stays on the ground and can be picked up; a cop who gets up picks his cap up again if it lies near. Riot police keep their visor.
description.es = Los policías (de calle, novatos y del metro) pierden la gorra en una pelea como los pandilleros el sombrero: con golpes fuertes, al quedar noqueados o morir. La gorra queda en el suelo y se puede recoger; el policía que se levanta la recoge si sigue cerca. Los antidisturbios conservan el visor.
version = 1.3
author = WarriorsReborn
saves = no
boot = record.lua
after.config_preload2 = extend.lua
