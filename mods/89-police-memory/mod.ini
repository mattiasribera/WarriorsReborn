; WarriorsReborn mod (docs/MODDING.md, "Police memory"). Our own code: it changes the arguments of
; the game's own police calls and keeps its notoriety with ModSave; no game files are included.
id = police-memory
name = The police remember you
name.es = La policía te recuerda
description = The police remember where you caused trouble: back on that district's streets there are more patrols (even in free roam), more cops answer a crime and they react sooner. Notoriety is kept per profile and fades with calm time and missions played elsewhere. Pairs with Warriors Mode.
description.es = La policía recuerda dónde armaste lío: en las calles de ese barrio hay más patrullas (también en paseo libre), acuden más agentes a cada delito y reaccionan antes. La fama se guarda por perfil y baja con el tiempo tranquilo y las misiones en otro lado. Ideal con el Modo Warriors.
version = 1.1
author = WarriorsReborn
saves = no
boot = police_memory.lua
