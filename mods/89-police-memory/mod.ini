; WarriorsReborn mod (docs/MODDING.md, "Police memory"). Our own code: it changes the arguments of
; the game's own police calls and keeps its notoriety with ModSave; no game files are included.
id = police-memory
name = The police remember you
name.es = La policía te recuerda
description = The police remember where you caused trouble: next time you pass through that district there are more patrols, more cops answer a crime and they react sooner. Notoriety is kept per profile and fades with time spent calm and with missions played elsewhere. Pairs well with Warriors Mode.
description.es = La policía recuerda dónde armaste lío: la próxima vez que pases por ese barrio hay más patrullas, acuden más agentes a cada delito y reaccionan antes. La fama se guarda por perfil y baja con el tiempo tranquilo y con las misiones jugadas en otro lado. Ideal con el Modo Warriors.
version = 1.0
author = WarriorsReborn
saves = no
boot = police_memory.lua
