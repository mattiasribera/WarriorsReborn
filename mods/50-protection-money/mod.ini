id = protection-money
name = Protection money
name.es = Dinero de protección
description = Collect protection on the Coney streets as in the story mission: walk up to an open shop owner, press Talk and ask for the money; he pays $25. The butcher, Voodoo Motors and the Little Buddha pay again every 10 minutes of game time, and Charlie's plumbing store opens at random too. Changes your save's money.
description.es = Cobra la protección en Coney como en la misión: acércate a un comerciante abierto, pulsa Hablar y pídele el dinero; te paga 25 $. La carnicería, Voodoo Motors y el Little Buddha vuelven a pagar cada 10 minutos de juego, y la fontanería de Charlie también abre al azar. Cambia el dinero de tu partida.
version = 1.0
author = WarriorsReborn
saves = yes
after.level95_coney = protection.lua
