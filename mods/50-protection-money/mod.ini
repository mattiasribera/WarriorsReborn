id = protection-money
name = Protection money
name.es = Dinero de protección
description = Collect protection in Coney as in the story mission: walk up to an open shop owner, press Talk and ask for the money; he pays $25. The butcher, Voodoo Motors and the Little Buddha pay again every 10 minutes of game time; Charlie's, Hot Dog Jimmy and the Gypsy open at random too. Changes your save's money.
description.es = Cobra la protección en Coney como en la misión: ve a un comerciante abierto, pulsa Hablar y pídele el dinero; te paga 25 $. La carnicería, Voodoo Motors y el Little Buddha vuelven a pagar cada 10 minutos de juego; Charlie, Hot Dog Jimmy y Gypsy también abren al azar. Cambia el dinero de tu partida.
version = 1.1
author = WarriorsReborn
saves = yes
after.level95_coney = protection.lua
