; WarriorsReborn example mod (docs/MODDING.md). Our own code: it calls the game's own storekeeper
; and money functions by name; no game files are included.
id = protection-money
name = Protection money
name.es = Dinero de protección
description = Collect protection on the Coney streets as in the story mission where the Warriors collect it: walk up to an open shop owner and press Talk, ask for the money and he pays $25. The butcher shop, Voodoo Motors and the Little Buddha (open at random, as in the game) pay again every 10 minutes of game time, not only in the game's three collection rounds, and Charlie's plumbing store now opens at random too. Changes the money in your save.
description.es = Cobra la protección en las calles de Coney como en la misión de la protección: acércate a un comerciante abierto y pulsa Hablar, pídele el dinero y te paga 25 $. La carnicería, Voodoo Motors y el Little Buddha (abiertos al azar, como en el juego) vuelven a pagar cada 10 minutos de juego, no solo en las tres rondas de cobro del juego, y la fontanería de Charlie ahora también abre al azar. Cambia el dinero de tu partida guardada.
version = 1.0
author = WarriorsReborn
saves = yes
after.level95_coney = protection.lua
