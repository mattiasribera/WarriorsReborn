; WarriorsReborn mod (docs/MODDING.md, "Lasting scars"). Our own code: it remembers how beaten each
; Warrior ended a level (ModSave) and shows healed marks made from the game's own blood overlay
; (the runtime's ModScar); no game files are included.
id = scars
name = Lasting scars
name.es = Cicatrices que duran
description = A Warrior who ended a level badly beaten shows bruises, closed cuts or a plaster in the next missions, fading over the night. Remembered per Warrior and per save profile.
description.es = Un Warrior que terminó un nivel muy golpeado aparece con moretones, cortes cerrados o una curita en las misiones siguientes, y se le van borrando a lo largo de la noche. Se recuerda por Warrior y por perfil.
version = 1.0
author = WarriorsReborn
saves = no
boot = scars.lua
after.level* = scars.lua
