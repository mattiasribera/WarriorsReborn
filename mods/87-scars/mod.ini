; WarriorsReborn mod (docs/MODDING.md, "Lasting scars"). Our own code: it remembers how beaten each
; Warrior ended a level (ModSave) and shows healed marks made from the game's own blood overlay
; (the runtime's ModScar); no game files are included.
id = scars
name = Lasting scars
name.es = Cicatrices que duran
description = A Warrior who ended a story mission badly beaten shows bruises, closed cuts or a plaster in the hideout and the next missions, fading over the night. Replays and other levels outside the story start clean. Remembered per Warrior and per save profile.
description.es = Un Warrior que terminó una misión de la historia muy golpeado aparece con moretones, cortes cerrados o una curita en el cuartel y las misiones siguientes, y se le van borrando a lo largo de la noche. Las misiones repetidas y los niveles fuera de la historia empiezan limpios. Se recuerda por Warrior y por perfil.
version = 1.1
author = WarriorsReborn
saves = no
boot = scars.lua
after.level* = scars.lua
