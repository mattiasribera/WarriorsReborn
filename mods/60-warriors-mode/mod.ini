; WarriorsReborn mod (docs/MODDING.md, "Warriors Mode"). Our own code: it changes the game's own
; difficulty settings by calling the game's own config functions; no game files are included.
id = warriors-mode
name = Warriors Mode (truly hard)
name.es = Modo Warriors (difícil de verdad)
description = Adds WARRIORS to the new-game difficulty list. From Hard and further: enemies hit 25% harder, block more, attack three at a time; flash heals half, money comes in at 60%, more police. Only profiles that chose it (mod.ini apply_to_all = yes: every profile). Story only.
description.es = Añade WARRIORS a la dificultad al empezar partida. Desde Difícil y más allá: los enemigos pegan un 25% más, bloquean más y atacan de a tres; el flash cura la mitad, el dinero entra al 60% y hay más policía. Solo en los perfiles que lo eligen. Solo historia.
version = 1.1
author = WarriorsReborn
saves = yes
min_runtime = 1.4
; yes = every profile plays Warriors Mode, as before 1.1 (no WARRIORS choice in the list)
apply_to_all = no
boot = warriors_mode.lua
after.config_easy = warriors_mode.lua
after.config_normal = warriors_mode.lua
after.config_hard = warriors_mode.lua
