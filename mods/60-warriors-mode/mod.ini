; WarriorsReborn mod (docs/MODDING.md, "Warriors Mode"). Our own code: it changes the game's own
; difficulty settings by calling the game's own config functions; no game files are included.
id = warriors-mode
name = Warriors Mode (truly hard)
name.es = Modo Warriors (difícil de verdad)
description = Goes past the game's Hard: enemies hit 25% harder, block more, recover faster, attack three at a time and break a long block sooner; flash heals half, money comes in at 60%, more police come sooner; your fighter stays as on Hard. Story only. With the mod on, whichever difficulty you pick plays as Warriors Mode.
description.es = Más allá de Difícil: enemigos que pegan un 25% más, bloquean y se recuperan más, atacan de a tres y rompen antes una guardia larga; el flash cura la mitad, dinero al 60%, más policía y antes; tú, como en Difícil. Solo historia. Con el mod activo, cualquier dificultad que elijas se juega en Modo Warriors.
version = 1.0
author = WarriorsReborn
saves = yes
boot = warriors_mode.lua
after.config_easy = warriors_mode.lua
after.config_normal = warriors_mode.lua
after.config_hard = warriors_mode.lua
