; WarriorsReborn mod (docs/MODDING.md, "Warriors Mode"). Our own code: it changes the game's own
; difficulty settings by calling the game's own config functions; no game files are included.
id = warriors-mode
name = Warriors Mode (truly hard)
name.es = Modo Warriors (difícil de verdad)
description = Starts from the game's Hard difficulty and goes further: enemies hit 25% harder, block more, recover faster, attack three at a time and break a long block sooner; flash heals half, money comes in at 60%, police come sooner and in greater numbers. Your fighter stays as on Hard. Story only.
description.es = Parte de la dificultad Difícil y va más lejos: los enemigos pegan un 25% más, bloquean más, se recuperan antes, atacan de a tres y rompen antes una guardia larga; el flash cura la mitad, el dinero entra al 60% y la policía llega antes y con más agentes. Tu luchador queda como en Difícil. Solo historia.
version = 1.0
author = WarriorsReborn
saves = yes
boot = warriors_mode.lua
after.config_easy = warriors_mode.lua
after.config_normal = warriors_mode.lua
after.config_hard = warriors_mode.lua
