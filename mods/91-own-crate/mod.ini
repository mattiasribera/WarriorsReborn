; WarriorsReborn example mod (docs/MODDING.md "Your own assets"). Everything in it is our own:
; the crate's mesh (own/crate.glb, made by tools/mod_examples/make_crate_glb.py), its wood texture
; and its knock (painted and synthesised by assets.ini). No game files are included or needed.
id = own-crate
