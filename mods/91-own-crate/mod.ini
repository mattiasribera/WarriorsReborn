description.es = Ejemplo de recursos propios de un mod: una caja de madera (un .glb hecho por nosotros) en la guarida junto a donde empiezas, sólida al chocarla, y suena al golpearla. Se crea desde los archivos del mod en su primera carga.
version = 1.0
