; A crate of our own (docs/MODDING.md "Your own assets"): the mesh is own/crate.glb (made by
; tools/mod_examples/make_crate_glb.py), the texture and the knock are made here. Nothing of the game's.
format = 1

[source crate-glb]
file = own/crate.glb                 ; a "crate" mesh and a "collision" box, Y-up metres

[texture crate-wood]                 ; top half: the planks, bottom half: the beams (the .glb's UVs)
canvas = 256 256, colour 120 80 45
place  = wood 150 104 62 seed 5, at 0 0 256 128, as planks
place  = wood 92 60 34 seed 9, at 0 128 256 128, as beams

[mesh crate]
from    = crate-glb
take    = all                        ; modelled standing on its origin: the object's own frame
host    = dyn_s_paper_list           ; drawn instead of a sheet of paper...
colour  = ff000000
texture = crate-wood
group   = crate
placed  = yes                        ; ...only where crate.lua puts its point (ModMeshPoint)

[collision crate-col]                ; the "collision" box, where crate.lua places the crate
from     = crate-glb
level    = level95
at       = -184.2 95.0 -194.38
material = 7                         ; wood

[sound knock]                        ; a hollow wooden knock
synth = sweep 180 70, seconds 0.35, attack 0.002, decay 0.06, noise 0.45, seed 3, volume 0.9
synth = tone 420, seconds 0.12, decay 0.03, volume 0.25
