# Builds the Windows release zip from a tag, attests its build provenance and creates a draft
# pre-release with the zip and SHA256SUMS.txt. The maintainer reviews and publishes the draft.
#
# Run by hand (workflow_dispatch) it is a dry run: the same build, gates and packaging, with the
# zip uploaded as a workflow artifact only (no attestation, no release).
#
# Everything that ends up in the zip is pinned and checked against a SHA-256 below: zig (compiler
# and the libc++/mingw-w64 code it links in), glslang (SPIR-V of the embedded shaders),
# Vulkan-Headers and the SDL2 mingw development package (headers, import library and the
# upstream SDL2.dll shipped in the zip). The packaging itself is tools/package_release.py.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  GLSLANG_VERSION: 16.6.0
  GLSLANG_SHA256: 2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce
  VULKAN_HEADERS_VERSION: 1.4.363
  VULKAN_HEADERS_SHA256: cbaf687d3c59b9666fe080e7f8396b6b4f4d344a768ee6b337c59852f4526b68
  SDL2_VERSION: 2.32.10
  SDL2_DEVEL_SHA256: 83a5d74012311edc3c0d40ea6faecbe57ad692aa033fa5dc273cc937e3938ff2
  # i686-w64-mingw32/bin/SDL2.dll of that package, the SDL2.dll in the zip.
  SDL2_DLL_SHA256: b0b1250d38be7aff93684b8e2b4d9bfd74370cc524f7772313315679f763b807

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe in the Makefiles needs the tags
          persist-credentials: false

      - name: Release version
        id: version
        run: |
          version="$(python3 tools/package_release.py version)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match RELEASE_VERSION $version of the Makefiles"
            exit 1
          fi
          python3 tools/package_release.py notes --version "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Public-tree guard
        run: python3 tools/check_public_tree.py

      - name: Forbidden-name gate
        # The bracketed letters keep this file from matching its own pattern.
        run: |
          if git grep -i -n -E 'play[s]tation|dual[s]hock|[s]ony|make_ps_[g]lyphs|scene[q]a'; then
            echo "::error::forbidden names in the tracked files"
            exit 1
          fi

      - name: Host packages for the Linux tests (i386 runtime libraries)
        # Only the Linux test programs use these; nothing from apt goes into the zip.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6:i386 libsdl2-2.0-0:i386 python3-numpy python3-pil

      - name: Pinned toolchain and dependencies
        run: |
          deps="$RUNNER_TEMP/deps"
          mkdir -p "$deps"
          cd "$deps"
          fetch() { # url file sha256
            curl -sSLf --retry 3 -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          fetch "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            zig.tar.xz "$ZIG_SHA256"
          fetch "https://github.com/KhronosGroup/glslang/releases/download/$GLSLANG_VERSION/glslang-$GLSLANG_VERSION-linux-x86_64-release.tar.gz" \
            glslang.tar.gz "$GLSLANG_SHA256"
          fetch "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VULKAN_HEADERS_VERSION.tar.gz" \
            vulkan-headers.tar.gz "$VULKAN_HEADERS_SHA256"
          fetch "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-devel-$SDL2_VERSION-mingw.tar.gz" \
            sdl2-devel.tar.gz "$SDL2_DEVEL_SHA256"
          mkdir zig glslang sdl
          tar -xJf zig.tar.xz -C zig --strip-components=1
          tar -xzf glslang.tar.gz -C glslang
          tar -xzf vulkan-headers.tar.gz
          tar -xzf sdl2-devel.tar.gz -C sdl
          sdl="$deps/sdl/SDL2-$SDL2_VERSION"
          echo "$SDL2_DLL_SHA256  $sdl/i686-w64-mingw32/bin/SDL2.dll" | sha256sum -c -
          echo "$deps/zig" >> "$GITHUB_PATH"
          {
            echo "VULKAN_HEADERS=$deps/Vulkan-Headers-$VULKAN_HEADERS_VERSION"
            echo "GLSLANG=$deps/glslang/bin/glslangValidator"
            echo "SDL2_DIR=$sdl"
          } >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          zig version
          "$GLSLANG" --version | head -n 1

      - name: Build runtime (Linux, for the tests)
        run: make -C runtime -j4 all VULKAN_INCLUDE="$VULKAN_HEADERS/include" GLSLANG="$GLSLANG"

      - name: Build runtime (Windows, cross-compiled)
        run: make -C runtime -j4 windows VULKAN_INCLUDE="$VULKAN_HEADERS/include" GLSLANG="$GLSLANG"

      - name: Build launcher (Linux for the tests, and Windows)
        run: |
          make -C launcher -j4 all SDL2_DEVEL="$SDL2_DIR/i686-w64-mingw32"
          make -C launcher -j4 windows SDL2_DEVEL="$SDL2_DIR/i686-w64-mingw32"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 tools/package_release.py package --version "$VERSION" \
            --sdl2-devel "$SDL2_DIR" --zig-lib "$(dirname "$(command -v zig)")/lib" \
            --vulkan-headers "$VULKAN_HEADERS" --out dist
          cp "$RUNNER_TEMP/notes.md" dist/notes.md

      - name: Forbidden-name gate on the zip contents
        run: |
          mkdir "$RUNNER_TEMP/unzipped"
          unzip -q dist/*.zip -d "$RUNNER_TEMP/unzipped"
          if grep -r -a -i -l -E 'play[s]tation|dual[s]hock|[s]ony|make_ps_[g]lyphs|scene[q]a' "$RUNNER_TEMP/unzipped"; then
            echo "::error::forbidden names in the zip"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/notes.md
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Check the zip against SHA256SUMS.txt
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/WarriorsReborn-v${{ env.VERSION }}-windows-x64.zip

      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --prerelease \
            --title "WarriorsReborn $TAG (beta)" --notes-file dist/notes.md \
            "dist/WarriorsReborn-v$VERSION-windows-x64.zip" dist/SHA256SUMS.txt
